name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Committed build output is current
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist/ is stale. Run npm run build and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Budget and template-token lint
        run: npm run validate

      - name: Plugin and marketplace manifest validation
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

      - uses: astral-sh/setup-uv@v5

      - name: Agent Skills specification validator
        run: |
          for skill in skills/*/; do
            echo "::group::$skill"
            uvx --from skills-ref agentskills validate "$skill"
            echo "::endgroup::"
          done
